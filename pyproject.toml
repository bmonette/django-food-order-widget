[project]
name = "django-food-order-widget"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.14",
    "django-cors-headers>=4.9.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
]

# line-length is set to 88 to be compatible with black and ruff
[tool.ruff]
line-length = 88
target-version = "py313"

# Linting rules (E = pycodestyle errors, F = pyflakes, I = isort, B = flake8-bugbear)
# see https://beta.ruff.rs/docs/rules/
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

# Test configuration for pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

# Configuration for djlint (Django template linter)
[tool.djlint]
profile = "django"
indent = 2

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.14",
]
